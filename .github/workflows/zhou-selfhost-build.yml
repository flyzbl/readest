name: Self-hosted Readest personal builds

on:
  push:
    branches: [zhou/selfhost-unlocked-latest]
    paths:
      - '.github/workflows/zhou-selfhost-build.yml'
      - 'apps/readest-app/.env.tauri'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readest-personal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Apple Silicon DMG
    runs-on: macos-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @readest/readest-app setup-vendors
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - name: Verify private-build switches
        run: |
          grep -qx 'NEXT_PUBLIC_SELF_HOSTED=true' apps/readest-app/.env.tauri
          grep -qx 'NEXT_PUBLIC_DISABLE_UPDATER=true' apps/readest-app/.env.tauri
      - name: Build macOS package without release secrets
        working-directory: apps/readest-app
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg --config '{"build":{"beforeBuildCommand":"pnpm build"}}'
      - name: Publish DMG for manual installation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Readest-selfhost-macOS-arm64
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;28.2.13676358'
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @readest/readest-app setup-vendors
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - name: Verify private-build switches
        run: |
          grep -qx 'NEXT_PUBLIC_SELF_HOSTED=true' apps/readest-app/.env.tauri
          grep -qx 'NEXT_PUBLIC_DISABLE_UPDATER=true' apps/readest-app/.env.tauri
      - name: Build unsigned-for-release / debug-signed APK
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          pnpm tauri android build --debug --target aarch64 --config '{"build":{"beforeBuildCommand":"pnpm build"}}'
      - name: Publish debug APK for manual installation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Readest-selfhost-Android-arm64-debug
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
